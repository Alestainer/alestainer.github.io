<!doctype html><html><head><meta charset="utf-8">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{background:#fff}
 #card{width:1200px;height:630px;background:#fff;font-family:Inter,-apple-system,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
 h1{font-size:46px;font-weight:800;color:#0f172a;letter-spacing:-1px}
 .row{display:flex;gap:44px}
 .wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
 .card{width:392px;height:392px;border:2px solid #e2e8f0;border-radius:16px;padding:10px}
 canvas{width:100%;height:100%;display:block}
 .tag{font-size:22px;font-weight:700;color:#64748b}
</style></head><body>
<div id="card">
  <h1>Which one is truly random?</h1>
  <div class="row">
    <div class="wrap"><div class="card"><canvas data-r="0.028" width="780" height="780"></canvas></div><div class="tag">A</div></div>
    <div class="wrap"><div class="card"><canvas data-r="0" width="780" height="780"></canvas></div><div class="tag">B</div></div>
  </div>
</div>
<script>
 function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
 function poisson(r,n){const p=[];for(let i=0;i<n;i++)p.push([r(),r()]);return p;}
 function hardcore(rng,n,r){const pts=[],r2=r*r;let a=0;
   while(pts.length<n&&a<n*8000){a++;const p=[rng(),rng()];let ok=true;
     for(const q of pts){const dx=q[0]-p[0],dy=q[1]-p[1];if(dx*dx+dy*dy<r2){ok=false;break;}}
     if(ok)pts.push(p);}return pts;}
 const N=120,SEED=20260817,S=780;
 document.querySelectorAll('canvas').forEach(c=>{
   const r=Number(c.dataset.r);
   const pts=r===0?poisson(mulberry32(SEED^0x9e3779b9),N):hardcore(mulberry32(SEED^0x85ebca6b),N,r);
   const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,S,S);
   const pad=S*0.045, inner=S-pad*2; ctx.fillStyle='#1e293b';
   for(const[x,y]of pts){ctx.beginPath();ctx.arc(pad+x*inner,pad+y*inner,S*0.0108,0,Math.PI*2);ctx.fill();}
 });
</script></body></html>
